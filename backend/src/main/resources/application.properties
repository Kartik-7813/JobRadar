spring.application.name=jobradar-backend

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${JOBRADAR_DB_URL:jdbc:postgresql://localhost:5432/jobradar_db}
spring.datasource.username=${JOBRADAR_DB_USERNAME:jobradar_user}
spring.datasource.password=${JOBRADAR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never